<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Update Students Details</h1>
    <form action="" method="post">
        {% csrf_token %}
        <label for="fname">First Name</label>
        <input type="text" name="fname" value="{{student.firstName}}"> <br>
        <label for="lname">Last Name</label>
        <input type="text" name="lname" value="{{student.secondName}}"> <br>
        <label for="email">Email</label>
        <input type="email" name="email" value="{{student.email}}"> <br>
        <label for="age">Age</label>
        <input type="number" name="age" value="{{student.age}}"> <br>
        <label for="regNo">Reg No</label>
        <input type="text" name="regNo" value="{{student.regNo}}"> <br>
        <button type="submit">Submit</button>
    </form>   
</body>
</html>
